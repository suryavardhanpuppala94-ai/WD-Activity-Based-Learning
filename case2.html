
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #dcebdc;
            color: #444444;
            line-height: 1.6;
        }

        .form-wrapper {
            max-width: 650px;
            margin: 30px auto;
            padding: 15px;
        }

        .form-card {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #c8ddc8;
        }

        h1 {
            text-align: center;
            color: #3e6547;
            margin-top: 0;
        }

        .form-intro {
            text-align: center;
            color: #666666;
            margin-bottom: 25px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            margin-bottom: 18px;
        }

        .form-group label {
            flex: 0 0 120px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select {
            width: auto;
            min-width: 0;
            flex: 1;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: 2px solid #a9c9aa;
            border-color: #5c8562;
        }

        fieldset {
            border: 1px solid #d5dfd5;
            border-radius: 5px;
            padding: 12px;
            margin-bottom: 18px;
        }

        legend {
            font-weight: bold;
            color: #3e6547;
        }

        .choice {
            display: inline-block;
            margin: 5px 12px 5px 0;
        }

        .form-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .button {
            background-color: #5c8562;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        .button:hover {
            background-color: #426748;
        }

        .button-light {
            background-color: #f3e3d7;
            color: #444444;
        }

        .button-light:hover {
            background-color: #ead2c0;
        }

        .muted {
            color: #777777;
        }

        .small-text {
            font-size: 13px;
            margin-top: 18px;
        }

        @media (max-width: 500px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .form-card {
                padding: 18px;
            }

            .form-group label {
                flex-basis: 100px;
            }

            .choice {
                display: block;
            }
        }
    </style>
</head>

<body>
    <main class="form-wrapper">
        <section class="form-card">
            <h1>Student Registration</h1>
            <form action="#" method="get">
                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first-name"
                               placeholder="Enter first name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="last-name"
                           placeholder="Enter last name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="Enter email address" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="mobile">Mobile Number</label>
                        <input type="tel" id="mobile" name="mobile"
                               placeholder="Enter mobile number">
                    </div>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob">
                </div>

                <div class="form-group">
                    <label for="branch">Branch</label>
                    <select id="branch" name="branch" required>
                        <option value="">Select your branch</option>
                        <option value="CSE">CSE</option>
                        <option value="CSE-AIML">CSE (AI &amp; Machine Learning)</option>
                        <option value="ECE">ECE</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <fieldset>
                    <legend>Gender</legend>
                    <label class="choice">
                        <input type="radio" name="gender" value="male"> Male
                    </label>
                    <label class="choice">
                        <input type="radio" name="gender" value="female"> Female
                    </label>
                    <label class="choice">
                        <input type="radio" name="gender" value="other">
                        Prefer not to say
                    </label>
                </fieldset>

                <fieldset>
                    <legend>Interests</legend>
                    <label class="choice">
                        <input type="checkbox" name="interest" value="coding"> Coding
                    </label>
                    <label class="choice">
                        <input type="checkbox" name="interest" value="design"> Web Design
                    </label>
                    <label class="choice">
                        <input type="checkbox" name="interest" value="ai"> AI / ML
                    </label>
                </fieldset>

                <div class="form-actions">
                    <button class="button" type="submit">Submit</button>
                    <button class="button button-light" type="reset">Reset</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
